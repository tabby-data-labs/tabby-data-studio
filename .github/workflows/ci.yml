name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # arm64 runner: matches the primary packaging target.
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # nvm is not available on CI runners; setup-node reads .nvmrc instead.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Runtime dependency budget
        run: npm run deps:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Boots the real Electron main process and asserts the security model:
      # no Node globals leak into the renderer, and the CSP actually blocks
      # eval + inline scripts in prod while permitting them in dev.
      - name: Smoke (prod CSP)
        run: npm run smoke

      - name: Smoke (dev CSP)
        run: npm run smoke:dev

      # Reported, not blocking. A 600-frame paint benchmark is CPU-bound, and
      # shared-runner load varies enough to make a hard p95 gate flaky. The
      # number is printed so a regression is still visible in the log; run
      # `npm run bench` locally for the gating assertion.
      - name: Performance benchmark (reported)
        run: npm run bench
        continue-on-error: true

      # Reported, not blocking: a transitive advisory in pg's tree should not
      # stall unrelated work. Escalate to blocking once the tree is clean.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate
        continue-on-error: true

  # Phase 4's exit criteria are claims about the server, not about our code: that
  # read-only mode is really on, that a NO SCROLL cursor really cannot scan
  # backward, that the first 1000 rows of a 10M-row table really land inside
  # 500ms. A mock can only confirm we asked for what we meant to ask for, so these
  # run against a real Postgres.
  #
  # Separate job on ubuntu-latest because service containers need Docker, which
  # the macOS runner does not provide.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tabby
          POSTGRES_PASSWORD: tabby
          POSTGRES_DB: tabby-data-test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TABBY_TEST_PG_HOST: localhost
      TABBY_TEST_PG_PORT: '5432'
      TABBY_TEST_PG_USER: tabby
      TABBY_TEST_PG_PASSWORD: tabby
      TABBY_TEST_PG_DATABASE: tabby-data-test
      # Prints the measured latencies into the log, so a regression is visible
      # even while the budget assertions still pass.
      TABBY_REPORT_PERF: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # 10M rows, one table per row-identity shape, type-fidelity and awkward
      # identifier fixtures, the `detail_sample` table the Phase 6 detail pane is
      # compared against `\d+`, and a 2,000-relation schema for the tree.
      # Idempotent; about a minute.
      - name: Load fixtures
        run: npm run pg:fixtures

      - name: Integration tests (live Postgres 18)
        run: npm run test:pg

      # The same Electron harness the verify job runs, but with the database
      # configured — which switches on its live section. That section is the only
      # thing in the repo that proves the columnar payload survives *Electron's*
      # serializer rather than Node's structuredClone: it decodes the raw bytes by
      # hand in the renderer and checks the typed arrays are still typed arrays.
      # Phase 6 added a second live section for the catalog payload — that
      # `format_type` modifiers, `pg_get_indexdef` text and the generated DDL all
      # arrive intact on the other side of the bridge.
      # xvfb because Electron needs a display even when nothing is watched.
      - name: Smoke with live data (columnar and catalog over real IPC)
        run: xvfb-run -a npm run smoke

      # Reported, not blocking, for the same reason as the verify job's bench: a
      # frame-time gate on a shared runner is flaky. With the database configured
      # this additionally drives the schema tree — expanding the 2,000-relation
      # fixture schema and scrolling it for 600 frames — and prints how many rows
      # were in the DOM. That number is Phase 6's exit criterion, so a regression
      # here is visible in the log even though it cannot fail the build.
      - name: Benchmark with live data (grid and tree, reported)
        run: xvfb-run -a npm run bench
        continue-on-error: true
